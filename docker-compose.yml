services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geospatial-measurement-api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:////app/data/geospatial.db
      - UPLOAD_DIR=/app/uploads
      - SYNC_PROCESSING_THRESHOLD_BYTES=5242880
    volumes:
      - ./data:/app/data
      - ./uploads:/app/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
