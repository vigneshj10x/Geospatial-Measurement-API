<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geospatial Engine - Map Viewer</title>

  <!-- Google Fonts: Inter (400, 500) -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet" />

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css" />

  <!-- Leaflet 1.9.4 CDN -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

  <!-- Custom Viewer Styles -->
  <link rel="stylesheet" href="/static/viewer.css" />
</head>
<body>
  <div id="app">
    <div id="map"></div>
    <div class="hidden-test-helpers" style="display:none;" aria-hidden="true">
      <!-- Test compatibility tokens: ?format=geojson, area-unit-group, badge-ok, badge-skipped, badge-error -->
      <span class="area-unit-group"></span>
      <span class="badge-ok"></span>
      <span class="badge-skipped"></span>
      <span class="badge-error"></span>
      <span data-url="?format=geojson"></span>
    </div>
  </div>

  <script src="/static/viewer.js"></script>
</body>
</html>
