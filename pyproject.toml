[project]
name = "geospatial-measurement-api"
version = "0.1.0"
description = "Geospatial File Measurement API using FastAPI, Shapely, PyProj, GeoPandas, and PyOgrio"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.141.1",
    "uvicorn==0.52.4",
    "sqlalchemy==2.0.52",
    "pydantic==2.13.5",
    "geopandas==1.2.0",
    "pyogrio==0.13.0",
    "shapely==2.2.0",
    "pyproj==3.8.0",
    "python-multipart==0.0.32",
    "defusedxml==0.7.1",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "httpx==0.28.1",
    "ruff==0.16.10",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
ignore = [
    "B008",  # do not perform function calls in argument defaults (FastAPI Depends)
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore:.*starlette.testclient.*:DeprecationWarning",
    "ignore:.*StarletteDeprecationWarning.*",
]
